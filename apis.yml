name: Aera Therapeutics
description: 'Aera Therapeutics is a genetic-medicines biotechnology company founded
  by a team of scientists, investors, and company builders to unlock the potential of
  genetic medicines through next-generation delivery technologies and precision payloads.
  Aera develops multiple proprietary delivery platforms — including Targeted Lipid
  Nanoparticles (tLNPs) and protein-nanoparticle systems — to broaden the application
  of genetic medicines across many disease areas, advancing a broad preclinical pipeline
  toward the clinic. Surfaced as a portfolio company of GV (Google Ventures) and added
  to the API Evangelist network. Aera is a therapeutics company and publishes no public
  developer API, portal, or documentation surface; this profile captures its corporate
  identity and domain-security posture. Sector: life-sciences.'
